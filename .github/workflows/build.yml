name: Build Project

# Generated by GitHub PR Agent. Build profile is selected by the user.
# Build type: Python
# Output mode: Release on tags

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build image2svg (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Build single-file executable
        run: pyinstaller --noconfirm --onefile --windowed --name "image2svg" --distpath dist "image_converter_gui.py"
      - uses: actions/upload-artifact@v7
        with:
          name: image2svg-windows
          path: dist/image2svg.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

