name: Build and Release Standalone Executable

on:
  push:
    tags:
      - 'v*' # Triggers workflow automatically when pushing version tags like v1.0.0
  workflow_dispatch: # Allows manual force compilation inside the GitHub Actions browser tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Core Code Assets
      uses: actions/checkout@v4

    - name: Set up Python Environment Workspace
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Framework Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Windows Executable Engine
      run: |
        pyinstaller --onefile --noconsole --collect-all pillow_heif --name="ImageToSvgConverter" image_converter_gui.py

    - name: Upload Compiled Binary Artifact for Verification
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Standalone-Executable
        path: dist/ImageToSvgConverter.exe

    - name: Automatically Create and Publish Release Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/ImageToSvgConverter.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
